name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "desktop/**"
      - "package.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type check
        run: npm run lint

      - name: Build packaged game and NSIS installer
        run: npm run build:desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: taxi-alexandria-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-installer-latest
          name: Taxi Alexandria 3D - Windows Installer
          prerelease: true
          draft: false
          make_latest: false
          files: release/*.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
